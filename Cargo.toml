# Workspace Cargo: satu repo, beberapa crate dengan peran berbeda (ADR-0002).
#
#   gb-web ──▶ gb-core ◀── gb-headless
#
# gb-core adalah inti emulator (tanpa I/O). Crate lain hanyalah "adapter"
# yang menghubungkan core ke browser atau ke command line.
[workspace]
resolver = "3"
members = ["crates/gb-core", "crates/gb-web", "crates/gb-headless"]

# Nilai bersama; tiap crate mewarisinya dengan `xxx.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Masalikovic/mxm-gameboy"

[workspace.dependencies]
gb-core = { path = "crates/gb-core" }
# Versi dikunci persis (`=`): wasm-bindgen-cli harus memakai versi yang sama
# (ADR-0003). Kalau angka ini diubah, ubah juga WASM_BINDGEN_VERSION di
# .github/workflows/ci.yml dan perintah instalasi di docs/setup-windows.md.
wasm-bindgen = "=0.2.129"

# Lint bersama untuk semua crate. `warn` di sini menjadi error di CI karena
# clippy dijalankan dengan `-D warnings`.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
# Untuk wasm: biner lebih kecil = halaman lebih cepat terbuka di HP.
lto = true
codegen-units = 1
